[workspace]
members = [
    "crates/rost",
    "crates/errors",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
memchr = "2.8.3"

[package]
name = "utilrs"
version.workspace = true
edition.workspace = true

[dependencies]
rost = { package = "utilrs-rost", path = "crates/rost", version = "0.1.0", optional = true }
errors = { package = "utilrs-errors", path = "crates/errors", version = "0.1.0", optional = true }

[features]
default = []
rost = ["dep:rost"]
errors = ["dep:errors"]
all = ["rost", "errors"]

[dev-dependencies]
utilrs = { path = ".", features = ["all"] }
